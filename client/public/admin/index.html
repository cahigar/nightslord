<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Estadísticas · Mooonsters</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #07040c; --surface: #150d1f; --surface2: #1f1430; --line: #3a2650; --grid: #2a1d3a;
  --text: #e8dcf0; --text2: #c3b4d4; --muted: #9a88b0; --gold: #ffd040;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good: #40e060; --bad: #ff5a6a;
  --px: 'Press Start 2P', monospace; --vt: 'VT323', monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--vt); font-size: 20px; line-height: 1.25; }
header { position: sticky; top: 0; z-index: 5; background: rgba(7, 4, 12, 0.94); border-bottom: 2px solid var(--line); backdrop-filter: blur(4px); }
.bar { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
h1 { font-family: var(--px); font-size: 14px; margin: 0; color: #f0e0ff; text-shadow: 2px 2px 0 #c0182a; }
h1 b { color: var(--gold); }
.live { font-family: var(--px); font-size: 10px; color: var(--good); display: flex; align-items: center; gap: 6px; }
.live i { width: 8px; height: 8px; background: var(--good); display: inline-block; animation: blink 1.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.spacer { flex: 1; }
.seg { display: flex; border: 2px solid var(--line); }
.seg button { font-family: var(--px); font-size: 10px; background: var(--surface); color: var(--muted); border: 0; padding: 7px 10px; cursor: pointer; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--surface2); color: var(--gold); }
.updated { color: var(--muted); font-size: 18px; }
main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.card { background: var(--surface); border: 2px solid var(--line); padding: 14px; min-width: 0; grid-column: span 6; }
.card.w12 { grid-column: span 12; } .card.w8 { grid-column: span 8; } .card.w4 { grid-column: span 4; }
@media (max-width: 900px) { .card, .card.w8, .card.w4 { grid-column: span 12; } }
.card h2 { font-family: var(--px); font-size: 11px; margin: 0 0 4px; color: #f0e0ff; letter-spacing: 0.5px; }
.card .sub { color: var(--muted); font-size: 18px; margin: 0 0 10px; }
.kpis { grid-column: span 12; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 2px solid var(--line); padding: 10px 12px; }
.kpi .k { color: var(--muted); font-size: 17px; }
.kpi .v { font-family: var(--px); font-size: 18px; color: var(--text); margin: 6px 0 2px; white-space: nowrap; }
.kpi .h { color: var(--muted); font-size: 16px; }
.kpi.hero .v { color: var(--gold); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 18px; color: var(--text2); margin: 0 0 6px; }
.legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 6px; background: var(--c); vertical-align: 0; border-radius: 2px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--vt); font-size: 15px; fill: var(--muted); }
svg .lbl { fill: var(--text2); }
.hbars { display: grid; gap: 6px; }
.hb { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto; gap: 8px; align-items: center; font-size: 18px; }
.hb .name { color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb .track { height: 12px; position: relative; }
.hb .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c, var(--s1)); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb .val { color: var(--text); text-align: right; min-width: 64px; }
table { width: 100%; border-collapse: collapse; font-size: 18px; }
th { font-family: var(--px); font-size: 9px; color: var(--muted); text-align: right; padding: 6px 6px; border-bottom: 2px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none; }
th:first-child, td:first-child { text-align: left; }
th[aria-sort="descending"]::after { content: ' ▼'; color: var(--gold); }
th[aria-sort="ascending"]::after { content: ' ▲'; color: var(--gold); }
td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td .mini { display: inline-block; height: 8px; background: var(--s1); border-radius: 0 3px 3px 0; vertical-align: middle; margin-right: 6px; }
.tablewrap { overflow-x: auto; }
.note { color: var(--muted); font-size: 17px; margin-top: 8px; }
.empty { color: var(--muted); padding: 18px 0; text-align: center; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: #0d0814; border: 2px solid var(--line); padding: 6px 9px; font-size: 18px; color: var(--text); max-width: 260px; box-shadow: 3px 3px 0 #000; display: none; }
.tip b { color: var(--gold); font-weight: normal; }
.gate { max-width: 560px; margin: 80px auto; text-align: center; padding: 24px; background: var(--surface); border: 2px solid var(--line); }
.gate p { color: var(--text2); }
.gate a { color: var(--gold); }
.tiles2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
.tiles2 .kpi { background: var(--surface2); }
/* reportes de errores de los jugadores */
.reports { max-width: 1240px; margin: 0 auto; padding: 16px 16px 0; }
.reports .card { grid-column: auto; }
.reports .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.reports .head h2 { margin: 0; }
.reports .head .spacer { flex: 1; }
.badge { font-family: var(--px); font-size: 10px; background: var(--bad); color: #fff; padding: 3px 6px; }
.rep { border: 2px solid var(--line); background: var(--surface2); padding: 8px 10px; margin: 8px 0 0; }
.rep.imp { border-color: var(--gold); }
.rep .meta { color: var(--muted); font-size: 17px; }
.rep .meta b { color: var(--text); font-weight: normal; }
.rep .txt { white-space: pre-wrap; word-break: break-word; margin: 4px 0; color: var(--text); }
.rep .ctx { color: var(--muted); font-size: 16px; word-break: break-all; }
.rep .acts { display: flex; gap: 6px; margin-top: 6px; }
.rbtn { font-family: var(--px); font-size: 9px; background: var(--surface); color: var(--text2); border: 2px solid var(--line); padding: 6px 8px; cursor: pointer; }
.rbtn:hover { color: var(--gold); border-color: var(--gold); }
.rbtn.on { color: var(--gold); border-color: var(--gold); }
.rbtn.danger { color: var(--bad); }
</style>
</head>
<body>
<header><div class="bar">
  <h1>MOOONSTERS · <b>ESTADÍSTICAS</b></h1>
  <span class="live" id="live" hidden><i></i><span id="liveTxt"></span></span>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Periodo" id="range">
    <button data-d="1">HOY</button><button data-d="7">7 D</button><button data-d="30" aria-pressed="true">30 D</button><button data-d="90">90 D</button>
  </div>
  <span class="updated" id="updated"></span>
</div></header>
<section class="reports" id="reports" hidden></section>
<main id="main"><div class="card w12 empty">Cargando…</div></main>
<div class="tip" id="tip"></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const DAY = 86400000;
const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
const token = (() => { try { return localStorage.getItem('nl_token') || sessionStorage.getItem('nl_token') || ''; } catch { return ''; } })();
let days = 30, data = null;
const narrow = () => innerWidth < 700; // en móvil las gráficas se dibujan más estrechas para que el texto se lea
try { days = Number(localStorage.getItem('stats_days')) || 30; } catch { /* */ }

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 0) => (n == null || Number.isNaN(n) ? '—' : Number(n).toLocaleString('es-ES', { maximumFractionDigits: d, minimumFractionDigits: d }));
const pct = (x, d = 0) => (x == null ? '—' : fmt(x * 100, d) + ' %');
const dur = (s) => { s = Math.round(s || 0); if (s < 60) return s + ' s'; const m = Math.floor(s / 60); if (m < 60) return m + ' min ' + (s % 60 ? String(s % 60).padStart(2, '0') + ' s' : ''); return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min'; };
const hrs = (s) => { const h = (s || 0) / 3600; return h >= 10 ? fmt(h) + ' h' : h >= 1 ? fmt(h, 1) + ' h' : fmt((s || 0) / 60) + ' min'; };
const dayLabel = (d, long) => { const t = new Date(d * DAY); return long ? t.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) : t.getUTCDate() + '/' + (t.getUTCMonth() + 1); };
const MODES = { normal: 'Free 4 All', lobby: 'Previa (Señor de la Noche)', br: 'El Señor de la Noche', tutorial: 'Tutorial' };
const CAUSES = { monstruo: 'Otro jugador', bot: 'Un bot', cazador: 'Cazadores', npc: 'Zombis / humanos', esbirro: 'Esbirros', sol: 'El sol', entorno: 'Fuego, trampas…', salir: 'Salió de la sala', fin: 'Fin de partida', ganador: 'Ganó la partida' };

// ------------------------------------------------------------ tooltip
const tip = $('tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block'; const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
function hideTip() { tip.style.display = 'none'; }
document.addEventListener('mousemove', (e) => { const el = e.target.closest?.('[data-tip]'); if (el) showTip(e, el.dataset.tip); else hideTip(); });
document.addEventListener('touchstart', (e) => { const el = e.target.closest?.('[data-tip]'); if (el) showTip(e.touches[0], el.dataset.tip); else hideTip(); }, { passive: true });

// ------------------------------------------------------------ piezas
const kpi = (k, v, h, hero) => `<div class="kpi${hero ? ' hero' : ''}"><div class="k">${k}</div><div class="v">${v}</div>${h ? `<div class="h">${h}</div>` : ''}</div>`;
const card = (cls, title, sub, body) => `<section class="card ${cls}"><h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}${body}</section>`;
const legend = (items) => `<div class="legend">${items.map(([n, c]) => `<span style="--c:${c}">${esc(n)}</span>`).join('')}</div>`;
const empty = (t = 'Aún no hay datos en este periodo.') => `<div class="empty">${t}</div>`;

/** Barras horizontales (una sola serie: el título dice qué se mide). */
function hbars(rows, opt = {}) {
  if (!rows.length) return empty();
  const max = Math.max(...rows.map((r) => r.v), 1);
  return `<div class="hbars">${rows.map((r) => `<div class="hb" data-tip="${esc(`<b>${esc(r.n)}</b><br>${r.t ?? r.f}`)}"><span class="name">${esc(r.n)}</span><span class="track"><span class="fill" style="width:${(r.v / max) * 100}%;${opt.c ? `--c:${opt.c}` : ''}"></span></span><span class="val">${r.f}</span></div>`).join('')}</div>`;
}

/** Barras verticales apiladas por día. series: [{n, c, k}] */
function stackedDays(rows, series, h = 190) {
  if (!rows.length) return empty();
  const W = narrow() ? 400 : 760, padL = 34, padB = 22, padT = 8, n = rows.length, gw = (W - padL) / n, bw = Math.max(3, Math.min(26, gw - 3));
  const tot = rows.map((r) => series.reduce((a, s) => a + (r[s.k] || 0), 0));
  const max = niceMax(Math.max(...tot, 1));
  const y = (v) => padT + (h - padT - padB) * (1 - v / max);
  let out = grid(W, h, padL, padB, padT, max);
  rows.forEach((r, i) => {
    const x = padL + i * gw + (gw - bw) / 2;
    const tipTxt = `<b>${dayLabel(r.d, true)}</b><br>${series.map((s) => `${s.n}: ${fmt(r[s.k] || 0)}`).join('<br>')}`;
    const segs = series.map((s) => ({ s, v: r[s.k] || 0 })).filter((g) => g.v > 0);
    let acc = 0;
    segs.forEach((g, gi) => {
      const yb = y(acc) - (gi > 0 ? 2 : 0); // 2 px de separación entre tramos
      acc += g.v;
      const hh = Math.max(1, yb - y(acc));
      out += gi === segs.length - 1 ? `<path d="${roundTop(x, yb, bw, hh)}" fill="${g.s.c}"/>` : `<rect x="${x}" y="${yb - hh}" width="${bw}" height="${hh}" fill="${g.s.c}"/>`;
    });
    out += `<rect x="${padL + i * gw}" y="${padT}" width="${gw}" height="${h - padT - padB}" fill="transparent" data-tip="${esc(tipTxt)}"/>`;
    if (n <= (narrow() ? 7 : 14) || i % Math.ceil(n / (narrow() ? 6 : 10)) === 0) out += `<text x="${x + bw / 2}" y="${h - 5}" text-anchor="middle">${dayLabel(r.d)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${h}" role="img">${out}</svg>`;
}
function roundTop(x, yb, w, hh) { const r = Math.min(4, w / 2, hh); return `M${x},${yb} V${yb - hh + r} Q${x},${yb - hh} ${x + r},${yb - hh} H${x + w - r} Q${x + w},${yb - hh} ${x + w},${yb - hh + r} V${yb} Z`; }
function niceMax(v) { const p = 10 ** Math.floor(Math.log10(v)); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function grid(W, h, padL, padB, padT, max) {
  let g = '';
  const lead = max / 10 ** Math.floor(Math.log10(max)), T = lead === 2 ? 4 : 5; // marcas redondas: 0-10-20… o 0-5-10…
  for (let i = 0; i <= T; i++) { const v = (max / T) * i, yy = padT + (h - padT - padB) * (1 - i / T); g += `<line x1="${padL}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/><text x="${padL - 6}" y="${yy + 4}" text-anchor="end">${fmt(v, v < 10 && max < 10 ? 1 : 0)}</text>`; }
  return g;
}

/** Líneas por hora (concurrencia) con cursor y tooltip. */
function lines(rows, series, h = 220, W = narrow() ? 400 : 1180) {
  if (rows.length < 2) return empty('Aún no hay suficientes muestras (se toma una cada minuto).');
  const padL = 34, padB = 22, padT = 8;
  const t0 = rows[0].t, t1 = rows[rows.length - 1].t;
  const max = niceMax(Math.max(1, ...rows.flatMap((r) => series.map((s) => r[s.k] || 0))));
  const x = (t) => padL + (W - padL - 4) * ((t - t0) / Math.max(1, t1 - t0));
  const y = (v) => padT + (h - padT - padB) * (1 - v / max);
  let out = grid(W, h, padL, padB, padT, max);
  const tz = -new Date().getTimezoneOffset() * 60000;
  for (let d = Math.ceil((t0 + tz) / DAY) * DAY - tz; d <= t1; d += DAY) out += `<line x1="${x(d)}" x2="${x(d)}" y1="${padT}" y2="${h - padB}" stroke="var(--grid)" stroke-dasharray="2 4"/><text x="${x(d)}" y="${h - 5}" text-anchor="middle">${new Date(d).toLocaleDateString('es-ES', { day: 'numeric', month: 'numeric' })}</text>`;
  series.forEach((s) => { out += `<path d="${rows.map((r, i) => `${i ? 'L' : 'M'}${x(r.t).toFixed(1)},${y(r[s.k] || 0).toFixed(1)}`).join('')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`; });
  const step = (W - padL) / rows.length;
  rows.forEach((r) => {
    const tt = new Date(r.t).toLocaleString('es-ES', { weekday: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    out += `<rect x="${x(r.t) - step / 2}" y="${padT}" width="${Math.max(2, step)}" height="${h - padT - padB}" fill="transparent" data-tip="${esc(`<b>${tt}</b><br>${series.map((s) => `${s.n}: ${fmt(r[s.k] || 0)}`).join('<br>')}`)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${h}" role="img">${out}</svg>`;
}

/** Mapa de calor día de la semana × hora (un solo tono: más claro = más sesiones). */
function heatmap(cells) {
  if (!cells.length) return empty();
  const W = narrow() ? 420 : 760, padL = 40, padT = 4, cw = (W - padL) / 24, ch = narrow() ? 18 : 22, H = padT + ch * 7 + 22;
  const m = new Map(cells.map((c) => [c.dow * 24 + c.h, c.n]));
  const max = Math.max(...cells.map((c) => c.n), 1);
  const DOW = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
  const lo = [26, 42, 74], hi = [134, 182, 239]; // del azul casi superficie al azul claro
  let out = '';
  for (let d = 0; d < 7; d++) {
    out += `<text x="${padL - 6}" y="${padT + d * ch + ch / 2 + 5}" text-anchor="end">${DOW[d]}</text>`;
    for (let hh = 0; hh < 24; hh++) {
      const n = m.get(d * 24 + hh) || 0, k = n / max;
      const col = n ? `rgb(${lo.map((v, i) => Math.round(v + (hi[i] - v) * Math.sqrt(k))).join(',')})` : 'var(--surface2)';
      out += `<rect x="${padL + hh * cw + 1}" y="${padT + d * ch + 1}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}" data-tip="${esc(`<b>${DOW[d]} ${hh}:00–${hh + 1}:00</b><br>${fmt(n)} sesiones`)}"/>`;
    }
  }
  for (let hh = 0; hh < 24; hh += 3) out += `<text x="${padL + hh * cw + cw / 2}" y="${H - 4}" text-anchor="middle">${hh}h</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${out}</svg>`;
}

/** Tabla ordenable. cols: [{k, n, f, bar}] */
function table(id, rows, cols, sortKey) {
  if (!rows.length) return empty();
  return `<div class="tablewrap"><table id="${id}" data-sort="${sortKey}"><thead><tr>${cols.map((c) => `<th data-k="${c.k}" title="${esc(c.title || '')}">${c.n}</th>`).join('')}</tr></thead><tbody></tbody></table></div>`;
}
const tables = {};
function fillTable(id, rows, cols, key, dir = -1) {
  const el = $(id); if (!el) return;
  tables[id] = { rows, cols, key, dir };
  const sorted = [...rows].sort((a, b) => (typeof a[key] === 'string' ? String(a[key]).localeCompare(b[key]) : (a[key] ?? -1) - (b[key] ?? -1)) * dir);
  const maxOf = Object.fromEntries(cols.filter((c) => c.bar).map((c) => [c.k, Math.max(...rows.map((r) => r[c.k] || 0), 1)]));
  el.querySelector('tbody').innerHTML = sorted.map((r) => `<tr>${cols.map((c) => `<td>${c.bar ? `<span class="mini" style="width:${Math.round(((r[c.k] || 0) / maxOf[c.k]) * 60)}px"></span>` : ''}${c.f ? c.f(r[c.k], r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('');
  el.querySelectorAll('th').forEach((th) => th.setAttribute('aria-sort', th.dataset.k === key ? (dir < 0 ? 'descending' : 'ascending') : 'none'));
}
document.addEventListener('click', (e) => {
  const th = e.target.closest('th[data-k]'); if (!th) return;
  const id = th.closest('table').id, t = tables[id]; if (!t) return;
  fillTable(id, t.rows, t.cols, th.dataset.k, t.key === th.dataset.k ? -t.dir : -1);
});

// ------------------------------------------------------------ panel
const CHAR_COLS = [
  { k: 'name', n: 'Personaje' },
  { k: 'secs', n: 'Tiempo', f: (v) => hrs(v), bar: true },
  { k: 'players', n: 'Jugadores', f: (v) => fmt(v) },
  { k: 'lives', n: 'Vidas', f: (v) => fmt(v) },
  { k: 'perLife', n: 'Vida media', f: (v) => dur(v), title: 'Cuánto dura de media una vida' },
  { k: 'lvl', n: 'Nivel medio', f: (v) => fmt(v, 1) },
  { k: 'kn', n: 'Humanos/vida', f: (v) => fmt(v, 1) },
  { k: 'kp', n: 'Monstruos/vida', f: (v) => fmt(v, 2) },
  { k: 'byHunter', n: '† cazador', f: (v) => pct(v), title: 'Vidas que acaban a manos de cazadores' },
  { k: 'byPlayer', n: '† monstruo', f: (v) => pct(v), title: 'Vidas que acaban a manos de otro monstruo (jugador o bot)' },
];
function render(D) {
  const K = D.kpi, R = D.retention, N = D.names || {}, TH = D.themes || {};
  $('live').hidden = false;
  $('liveTxt').textContent = `${D.online.playing} JUGANDO · ${D.online.conns} CONECTADOS`;
  $('updated').textContent = 'act. ' + new Date(D.generated).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  const per = D.days === 1 ? 'hoy' : `últimos ${D.days} días`;
  let h = `<div class="kpis">
    ${kpi('Jugando ahora', fmt(D.online.playing), `${fmt(D.online.byMode.normal || 0)} F4A · ${fmt((D.online.byMode.lobby || 0) + (D.online.byMode.br || 0))} Señor`, true)}
    ${kpi('Jugadores hoy', fmt(K.today), 'únicos')}
    ${kpi('Jugadores 7 días', fmt(K.d7), `${fmt(K.d30)} en 30 días`)}
    ${kpi('Nuevos', fmt(K.newRange), per)}
    ${kpi('Tiempo de juego', hrs(K.playHours * 3600), `${fmt(K.lives)} vidas · ${per}`)}
    ${kpi('Sesión media', dur(K.avgSession), `${dur(K.avgPlayed)} jugando`)}
    ${kpi('Vuelven al día siguiente', pct(R.d1), R.d1n ? `de ${fmt(R.d1n)} nuevos` : 'sin datos aún')}
    ${kpi('Vuelven en 7 días', pct(R.d7), R.d7n ? `de ${fmt(R.d7n)} nuevos` : 'sin datos aún')}
    ${kpi('Se van sin jugar', pct(K.bounce), 'abren y no entran a una sala')}
    ${kpi('Con cuenta Google', pct(K.google), 'del total de jugadores')}
  </div>`;

  // jugadores por día
  const daily = D.daily.map((r) => ({ ...r, ret: r.players - r.fresh }));
  h += card('w8', 'Jugadores por día', 'Únicos al día: los que entran por primera vez y los que repiten.',
    legend([['Nuevos', 'var(--s2)'], ['Repiten', 'var(--s1)']]) + stackedDays(daily, [{ n: 'Repiten', c: 'var(--s1)', k: 'ret' }, { n: 'Nuevos', c: 'var(--s2)', k: 'fresh' }]));
  // embudo
  const F = D.funnel;
  h += card('w4', 'Embudo', `De los que abren el juego (${per}), cuántos llegan a cada paso.`, hbars([
    { n: 'Abren el juego', v: F.visits, f: fmt(F.visits) },
    { n: 'Juegan', v: F.played, f: `${fmt(F.played)} · ${pct(F.visits ? F.played / F.visits : null)}` },
    { n: 'Juegan +3 min', v: F.played3, f: `${fmt(F.played3)} · ${pct(F.visits ? F.played3 / F.visits : null)}` },
    { n: 'Vuelven otro día', v: F.returned, f: `${fmt(F.returned)} · ${pct(F.visits ? F.returned / F.visits : null)}` },
    { n: 'Con cuenta Google', v: F.google, f: `${fmt(F.google)} · ${pct(F.visits ? F.google / F.visits : null)}` },
  ]) + `<p class="note">Tutorial empezado: ${fmt(D.tutorial)} jugadores.</p>`);

  // primer minuto de los nuevos
  const M = D.firstMinute;
  if (M) {
    const C = M.coach || {}, nn = M.newPlayers || 0, cs = (k) => (C[k] ? C[k].n : 0);
    const secs = (v) => (v == null ? '—' : `${fmt(v, 0)} s`);
    h += card('w6', 'Primer minuto (jugadores nuevos)', `De los ${fmt(nn)} jugadores nuevos (${per}): cuántos completan cada paso de la guía y cuánto tardan en cazar.`, hbars([
      { n: 'Nuevos', v: nn, f: fmt(nn) },
      { n: 'Se mueven', v: cs('move'), f: `${fmt(cs('move'))} · ${pct(nn ? cs('move') / nn : null)}` },
      { n: 'Primera caza (guía)', v: cs('hunt'), f: `${fmt(cs('hunt'))} · ${pct(nn ? cs('hunt') / nn : null)}` },
      { n: 'Usan Q / E', v: cs('abil'), f: `${fmt(cs('abil'))} · ${pct(nn ? cs('abil') / nn : null)}` },
      { n: 'Guía completa', v: cs('done'), f: `${fmt(cs('done'))} · ${pct(nn ? cs('done') / nn : null)}` },
      { n: 'Saltan la guía', v: cs('skip'), f: `${fmt(cs('skip'))} · ${pct(nn ? cs('skip') / nn : null)}` },
    ]) + `<p class="note">Primera caza: mediana ${secs(M.firstKill.median)} · media ${secs(M.firstKill.avg)} (${fmt(M.firstKill.n)} jugadores).<br>
      Sesiones de nuevos que se van <b>sin jugar</b>: ${fmt(M.noPlay)} (${pct(M.ended ? M.noPlay / M.ended : null)}) · que juegan <b>menos de 1 min</b>: ${fmt(M.under60)} (${pct(M.ended ? M.under60 / M.ended : null)}).<br>
      Recompensas diarias recogidas: ${fmt(M.daily?.n)} (${fmt(M.daily?.c)} 🪙).</p>`);
  }

  // concurrencia
  h += card('w12', 'Jugadores a la vez', 'Máximo por hora (últimos 14 días como mucho). Útil para saber cuándo hay gente y para dimensionar el servidor.',
    legend([['Free 4 All', 'var(--s1)'], ['El Señor de la Noche', 'var(--s2)']]) + lines(D.conc, [{ n: 'Free 4 All', c: 'var(--s1)', k: 'f4a' }, { n: 'El Señor de la Noche', c: 'var(--s2)', k: 'nl' }]));

  // personajes
  h += card('w12', 'Personajes', 'Ordena por cualquier columna. Muertes por cazador o por otro monstruo muy altas = personaje flojo; muchas bajas y nivel alto = quizá demasiado fuerte.', table('tChars', D.chars, CHAR_COLS, 'secs'));

  // modos y mapas
  h += card('', 'Modos', 'Tiempo jugado en cada modo.', hbars(D.modes.map((m) => ({ n: MODES[m.mode] || m.mode, v: m.secs, f: hrs(m.secs), t: `${hrs(m.secs)}<br>${fmt(m.players)} jugadores · ${fmt(m.lives)} vidas` }))));
  h += card('', 'Mapas', 'Tiempo jugado en cada mapa (sin tutorial).', hbars(D.maps.map((m) => ({ n: TH[m.theme] || m.theme, v: m.secs, f: hrs(m.secs), t: `${hrs(m.secs)}<br>${fmt(m.lives)} vidas` }))));

  // cuándo juegan
  h += card('w8', 'Cuándo juegan', 'Sesiones por día de la semana y hora (tu hora local). Buen momento para publicar en redes: justo antes de las horas más claras.', heatmap(D.hours));
  // duración
  const Lg = D.lengths || {};
  h += card('w4', 'Tiempo jugado por sesión', 'Cuánto juega cada visita.', hbars([
    { n: 'Nada', v: Lg.b0 || 0, f: fmt(Lg.b0 || 0) }, { n: '< 1 min', v: Lg.b1 || 0, f: fmt(Lg.b1 || 0) }, { n: '1–3 min', v: Lg.b2 || 0, f: fmt(Lg.b2 || 0) },
    { n: '3–10 min', v: Lg.b3 || 0, f: fmt(Lg.b3 || 0) }, { n: '10–30 min', v: Lg.b4 || 0, f: fmt(Lg.b4 || 0) }, { n: '30 min o más', v: Lg.b5 || 0, f: fmt(Lg.b5 || 0) },
  ]));

  // muertes
  const totalDeaths = D.causes.reduce((a, c) => a + c.n, 0) || 1;
  h += card('', 'Cómo terminan las vidas', 'De qué mueren (o si salen) los jugadores.', hbars(D.causes.map((c) => ({ n: CAUSES[c.cause] || c.cause, v: c.n, f: pct(c.n / totalDeaths), t: `${fmt(c.n)} vidas` }))));
  h += card('', 'Cazadores más letales', 'Qué tipo de cazador mata más jugadores.', hbars(D.killers.map((k) => ({ n: k.killer || '—', v: k.n, f: fmt(k.n) }))));

  // El Señor de la Noche
  const M = D.matches || {};
  h += card('', 'El Señor de la Noche', `Partidas (${per}).`, `<div class="tiles2">
      ${kpi('Partidas', fmt(M.n))}${kpi('Duración media', dur(M.dur))}
      ${kpi('Jugadores reales', fmt(M.reals, 1), 'de media')}${kpi('Gana un bot', pct(M.botWins), 'si sube mucho, los bots pegan demasiado')}
    </div>` + (D.winners.length ? `<p class="sub">Monstruos que más ganan (jugadores reales)</p>` + hbars(D.winners.map((w) => ({ n: N[w.c] || w.c, v: w.n, f: fmt(w.n) })), { c: 'var(--s2)' }) : ''));

  // tienda
  h += card('', 'Tienda', 'Personajes y skins comprados con monedas.', D.buys.length ? hbars(D.buys.map((b) => {
    const [ch, sk] = String(b.item).split(':');
    return { n: b.kind === 'buyChar' ? (N[ch] || ch) : `${N[ch] || ch} · ${sk}`, v: b.n, f: fmt(b.n), t: `${fmt(b.n)} compras · ${fmt(b.coins)} monedas` };
  })) : empty('Nadie ha comprado nada todavía en este periodo.'));

  // origen
  h += card('w4', 'De dónde vienen', 'Web de origen (referrer). Usa enlaces con ?utm_source=instagram para medir tus publicaciones.', hbars(D.refs.map((r) => ({ n: r.k === '—' ? 'Directo / app' : r.k, v: r.n, f: fmt(r.n) }))));
  h += card('w4', 'Campañas (utm)', 'Valor de ?utm_source= o ?ref= en el enlace.', hbars(D.utms.filter((u) => u.k !== '—').map((r) => ({ n: r.k, v: r.n, f: fmt(r.n) }))));
  h += card('w4', 'Dispositivos e idiomas', '', hbars(D.devices.map((r) => ({ n: r.k, v: r.n, f: fmt(r.n) }))) + '<div style="height:12px"></div>' + hbars(D.langs.map((r) => ({ n: r.k, v: r.n, f: fmt(r.n) })), { c: 'var(--s3)' }));

  $('main').innerHTML = h;
  fillTable('tChars', D.chars.map((c) => ({ ...c, name: N[c.char] || c.char, perLife: c.lives ? c.secs / c.lives : 0 })), CHAR_COLS, 'secs');
}

async function load() {
  if (!token) return gate('Inicia sesión con tu cuenta de Google en el juego (con una cuenta master) y vuelve a abrir esta página.');
  try {
    const r = await fetch(`/api/stats?days=${days}&tz=${-new Date().getTimezoneOffset()}`, { headers: { authorization: 'Bearer ' + token }, cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || j.error) return gate(j.error || 'No se pudieron cargar las estadísticas.');
    data = j; render(j);
  } catch { if (!data) gate('No se pudo conectar con el servidor.'); }
}
// ---------------------------------------------------------------- reportes de errores de los jugadores
let repOpen = false;
try { repOpen = localStorage.getItem('stats_reports') === '1'; } catch { /* */ }
async function loadReports(body) {
  try {
    const r = await fetch('/api/reports', body ? { method: 'POST', headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify(body) } : { headers: { authorization: 'Bearer ' + token }, cache: 'no-store' });
    if (!r.ok) return;
    renderReports((await r.json()).list || []);
  } catch { /* */ }
}
function renderReports(list) {
  const box = $('reports');
  box.hidden = false;
  const recent = list.filter((r) => Date.now() - r.created < DAY).length;
  const imp = list.filter((r) => r.important).length;
  const items = list.map((r) => {
    const when = new Date(r.created).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    const ctx = Object.entries(r.ctx || {}).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join(' · ');
    return `<div class="rep${r.important ? ' imp' : ''}">
      <div class="meta">${when} · <b>${esc(r.name)}</b></div>
      <div class="txt">${esc(r.text)}</div>
      <div class="ctx">${ctx}</div>
      <div class="acts"><button class="rbtn${r.important ? ' on' : ''}" data-id="${r.id}" data-a="imp">${r.important ? '★ IMPORTANTE' : '☆ MARCAR'}</button><button class="rbtn danger" data-id="${r.id}" data-a="del">🗑 BORRAR</button></div>
    </div>`;
  }).join('');
  box.innerHTML = `<div class="card"><div class="head"><h2>🐞 REPORTES DE JUGADORES · ${fmt(list.length)}</h2>${recent ? `<span class="badge">${recent} NUEVOS (24 H)</span>` : ''}${imp ? `<span class="badge" style="background:var(--s4)">${imp} ★</span>` : ''}<span class="spacer"></span><button class="rbtn" id="repToggle">${repOpen ? 'OCULTAR' : 'VER'}</button></div>
    ${repOpen ? (items || '<p class="empty">Nadie ha reportado nada todavía.</p>') : ''}</div>`;
  $('repToggle').onclick = () => { repOpen = !repOpen; try { localStorage.setItem('stats_reports', repOpen ? '1' : '0'); } catch { /* */ } renderReports(list); };
  box.querySelectorAll('button[data-a]').forEach((b) => b.addEventListener('click', () => {
    const id = Number(b.dataset.id), r = list.find((x) => x.id === id);
    if (b.dataset.a === 'imp') loadReports({ id, important: !r.important });
    else if (b.dataset.confirm) loadReports({ id, del: true });
    else { b.dataset.confirm = '1'; b.textContent = '¿SEGURO?'; }
  }));
}

function gate(msg) { $('main').innerHTML = `<div class="card w12 gate"><h2>🔒 PANEL PRIVADO</h2><p>${esc(msg)}</p><p><a href="/">Volver al juego</a></p></div>`; }

document.querySelectorAll('#range button').forEach((b) => {
  b.setAttribute('aria-pressed', String(Number(b.dataset.d) === days));
  b.addEventListener('click', () => {
    days = Number(b.dataset.d);
    try { localStorage.setItem('stats_days', String(days)); } catch { /* */ }
    document.querySelectorAll('#range button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    load();
  });
});
load();
if (token) loadReports();
setInterval(load, 60000);
setInterval(() => { if (token) loadReports(); }, 60000);
let rz = 0, wasNarrow = narrow();
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (data && narrow() !== wasNarrow) { wasNarrow = narrow(); render(data); } }, 200); });
</script>
</body>
</html>
