<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mooonsters</title>
  <meta name="description" content="Mooonsters: juego multijugador gratuito tipo .io. Elige entre 30 monstruos, caza humanos, esquiva a los Cazadores y conviértete en el Señor de la Noche." />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- fondo animado de la portada y el menú -->
  <canvas id="menubg" aria-hidden="true"></canvas>

  <!-- PORTADA -->
  <div id="splash" class="screen">
    <canvas id="parade" aria-hidden="true"></canvas>
    <div class="splash-inner">
      <div class="logo-wrap"><canvas id="splashlogo" width="220" height="84" aria-hidden="true"></canvas><span class="io">.com</span></div>
      <p class="tagline" data-i18n="splashTag"></p>
      <button id="start" class="btn big start" data-i18n="start"></button>
      <button id="tutbtn" class="btn tutbtn"></button>
      <p class="splash-hint" data-i18n="splashHint"></p>
    </div>
  </div>

  <!-- TUTORIAL: instrucciones y lecciones de práctica -->
  <div id="tutorial" class="screen" hidden>
    <div class="panel tutorial">
      <h2 id="tut-title"></h2>
      <div id="tut-rules" class="tut-rules"></div>
      <h3 id="tut-practice"></h3>
      <div id="tut-lessons" class="tut-lessons"></div>
      <div class="row center"><button id="tut-back" class="btn"></button><button id="tut-menu" class="btn"></button></div>
    </div>
  </div>

  <!-- MENÚ -->
  <div id="menu" class="screen" hidden>
    <div class="menu-inner">
      <header class="logo">
        <div class="logo-wrap"><canvas id="logo" width="220" height="84" aria-hidden="true"></canvas><span class="io">.com</span></div>
        <h1 class="sr-only">Mooonsters</h1>
      </header>

      <div class="menu-grid">
        <!-- 1) nombre y modo de juego, con «Jugar» arriba del todo -->
        <div class="panel blk-play">
          <div class="row between">
            <input id="name" maxlength="14" data-i18n-ph="namePh" autocomplete="off" />
            <div class="coins">🪙 <span id="coins">0</span></div>
          </div>
          <button id="play" class="btn big" data-i18n="play"></button>
          <details id="modes" class="modes">
          <summary data-i18n="modesTitle"></summary>
          <div class="row">
            <input id="code" class="code" maxlength="4" data-i18n-ph="codePh" autocomplete="off" />
            <button id="join" class="btn" data-i18n="join"></button>
          </div>
          <div class="row">
            <select id="theme">
              <option value="" data-i18n="randomMap"></option>
              <option value="elm"></option>
              <option value="transylvania"></option>
              <option value="camp"></option>
              <option value="swamp"></option>
              <option value="nile"></option>
              <option value="jungle"></option>
            </select>
            <label class="check"><input type="checkbox" id="priv" /> <span data-i18n="private"></span></label>
            <button id="create" class="btn" data-i18n="createRoom"></button>
          </div>
          </details>
          <div id="rooms" class="rooms"></div>
          <button id="tutbtn2" class="btn tiny tutbtn2"></button>
          <div id="menu-error" class="error"></div>
        </div>

        <!-- 2) monstruo: carrusel -->
        <div class="panel blk-chars">
          <h3 data-i18n="chooseMonster"></h3>
          <div id="chars"></div>
          <div id="charinfo" class="charinfo"></div>
          <h3 data-i18n="skin"></h3>
          <div id="skins" class="skins"></div>
          <!-- Hueco reservado para un banner de anuncio (no invasivo). Oculto hasta que haya anunciante: quitar "hidden". -->
          <div id="ad-slot" class="ad-slot" hidden></div>
        </div>

        <!-- 3) idioma, cuenta y medallas -->
        <div class="panel blk-id">
          <div id="langs" class="langs"></div>
          <div id="account" class="account"></div>
          <details>
            <summary><span data-i18n="medals"></span> <span id="medal-count"></span></summary>
            <div id="medals" class="medals"></div>
          </details>
        </div>
      </div>

      <p class="help" data-i18n-html="help"></p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" hidden>
    <div id="topleft">
      <div id="roominfo"></div>
      <div id="ping"></div>
      <button id="infobtn" class="btn tiny" data-i18n-title="infoBtn">i</button>
      <button id="mute" class="btn tiny">🔊</button>
      <button id="exit" class="btn tiny" data-i18n="exit"></button>
    </div>
    <div id="rank"></div>
    <div id="killfeed"></div>
    <canvas id="minimap" width="160" height="160"></canvas>
    <div id="upgrades" hidden></div>
    <div id="bottom">
      <div id="buffs"></div>
      <div class="bars">
        <div class="lvl" id="lvl">1</div>
        <div class="barstack">
          <div class="bar hp"><div id="hpfill"></div><span id="hptext"></span></div>
          <div class="bar xp"><div id="xpfill"></div></div>
        </div>
        <div class="stats"><div id="pts">0 pts</div><div id="gcoins">🪙 0</div></div>
      </div>
      <div id="abilities"></div>
    </div>
    <div id="toast"></div>
    <div id="infopanel" class="panel" hidden></div>
    <div id="tutpanel" hidden></div>
    <div id="tutdone" class="panel" hidden></div>
  </div>

  <!-- MUERTE -->
  <div id="death" class="screen" hidden>
    <div class="panel death">
      <h2 data-i18n="fallen"></h2>
      <p id="death-by"></p>
      <div id="death-stats" class="death-stats"></div>
      <h3 data-i18n="again"></h3>
      <div id="death-chars" class="small"></div>
      <div class="row center">
        <button id="respawn" class="btn big" data-i18n="respawn"></button>
        <button id="tomenu" class="btn" data-i18n="menu"></button>
      </div>
    </div>
  </div>

  <!-- TÁCTIL -->
  <div id="touch" hidden>
    <div id="stickzone"></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="tbuttons">
      <button id="tb-atk"><i class="cd"></i><b>⚔</b><small></small></button>
      <button id="tb-q"><i class="cd"></i><b>Q</b><small></small></button>
      <button id="tb-e"><i class="cd"></i><b>E</b><small></small></button>
      <button id="tb-r"><i class="cd"></i><b>R</b><small></small></button>
      <button id="tb-emote">😜</button>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
